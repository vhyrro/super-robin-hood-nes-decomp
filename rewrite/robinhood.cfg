MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0200, size = $0600, type = rw, file = "";
    HDR:    start = $0000, size = $0010, file = %O, fill = yes, fillval = $00;
    PRG0:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG1:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG2:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG3:  start = $C000, size = $3FF9, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFF9, size = $0007, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    HEADER:  load = HDR,   type = ro;
    PRG0:   load = PRG0, type = ro;
    PRG1:   load = PRG1, type = ro;
    PRG2:   load = PRG2, type = ro;
    PRG3:   load = PRG3, type = ro;
    VECTORS: load = VECTORS, type = ro;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:     load = RAM,   type = bss;
}
